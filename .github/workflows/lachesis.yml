name: lachesis
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # prove the repo to the Lachesis app so it can post as Lachesis[bot]
    steps:
      - uses: actions/checkout@v4

      # Release-candidate pin: the census/output contract is unreleased from v1.0.5.
      - uses: UnboundCompute/lachesis-action@bfc762d35fb9268f6fa407878bc5900eb34ab04f
        with:
          source: "."
          candidate-report: census
          # fail-on: "error"   # fail the PR on guard differentials (also mark `scan` a required check to block merges)
