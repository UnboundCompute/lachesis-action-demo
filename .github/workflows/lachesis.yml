name: lachesis
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # prove the repo to the Lachesis app so it can post as Lachesis[bot]
    steps:
      - uses: actions/checkout@v4

      # Release-candidate pin: the current candidate extends the v1.0.5 contract
      # with evidence outputs, stable fingerprints, and poster-independent SARIF.
      - uses: UnboundCompute/lachesis-action@aa843065ec4edc69ab1615413ac5f65048e504a7
        with:
          source: "."
          candidate-report: census
          # fail-on: "error"   # fail the PR on guard differentials (also mark `scan` a required check to block merges)
