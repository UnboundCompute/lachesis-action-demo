name: lachesis
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets the action prove the repo to the Lachesis app
    steps:
      - uses: actions/checkout@v4
      - uses: UnboundCompute/lachesis-action@branded-comments
        with:
          source: "svc"
          fail-on: "error"      # block the PR when an unguarded-sink-differential is found
